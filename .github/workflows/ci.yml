name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # macOS runner images carry Homebrew taps (e.g. aws/tap) that the new
      # tap-trust feature refuses to load, failing every brew call with exit 74.
      # The official mitigation is disabling the trust check.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The audit scripts need jq and ripgrep; macOS runners sometimes ship a
      # minimal ripgrep without PCRE2 (rg -oP) or no jq at all. Installing both
      # via Homebrew makes the gate deterministic. The quality gate is split
      # into separate steps so any failure pinpoints its target immediately.
      - name: Install audit tools
        run: brew install jq ripgrep
      - name: Security guardrails
        run: make security
      - name: Localization guardrails
        run: make localization
      - name: Site guardrails
        run: make site
      - name: Tests
        run: make test
      - name: Build (Debug, warnings as errors)
        run: xcodebuild -quiet -project Songleton.xcodeproj -scheme Songleton -configuration Debug build CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build (Release, warnings as errors)
        run: xcodebuild -quiet -project Songleton.xcodeproj -scheme Songleton -configuration Release -destination 'generic/platform=macOS' build CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
